<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamNXT Cast Receiver</title>
  <style>
    /*
     * Sizing is relative to the screen, never fixed pixels. Cast devices lay
     * the page out at very different CSS sizes — 1280×720 on older
     * Chromecasts, 1920×1080 on newer ones, and larger on 4K sets — so pixel
     * sizes that looked right on one read as "zoomed in" on another. The root
     * font size follows the smaller viewport side and everything else is rem,
     * so the whole layout scales as one. Clamped so it stays legible on a small
     * browser preview and does not balloon on a huge one.
     */
    :root {
      --accent: #e63946;
      --accent-2: #ff8c42;
      --bg: #07070d;
      --text: #ffffff;
      --text-dim: rgba(255,255,255,0.62);
      --text-faint: rgba(255,255,255,0.38);
      /* TV title-safe area: keep text away from the edges some sets crop. */
      --safe-x: 5vw;
      --safe-y: 5vh;
      font-size: clamp(10px, 2.2vmin, 40px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Idle / splash ───────────────────────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      padding: var(--safe-y) var(--safe-x);
      text-align: center;
      background:
        radial-gradient(60vmax 60vmax at 20% 15%, rgba(230,57,70,0.18), transparent 60%),
        radial-gradient(55vmax 55vmax at 85% 90%, rgba(255,140,66,0.12), transparent 60%),
        linear-gradient(160deg, #0b0812 0%, var(--bg) 60%);
      transition: opacity 0.6s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }

    #splash .logo-text {
      font-size: 4.6rem;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #splash .tagline {
      font-size: 1.35rem;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.01em;
    }
    #splash .ready {
      margin-top: 2.2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      font-size: 1rem;
      color: var(--text-dim);
    }
    #splash .ready .dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(230,57,70,0.6);
      animation: ping 1.8s ease-out infinite;
    }
    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 rgba(230,57,70,0.55); }
      80%  { box-shadow: 0 0 0 0.9rem rgba(230,57,70,0); }
      100% { box-shadow: 0 0 0 0 rgba(230,57,70,0); }
    }

    /* ── Player ──────────────────────────────────────────────────── */
    #player {
      position: fixed;
      inset: 0;
      z-index: 5;
    }
    cast-media-player {
      width: 100%;
      height: 100%;
      --background-color: var(--bg);
      --progress-color: var(--accent);
      --advancement-color: var(--accent);
      --advancement-disabled-color: rgba(255,255,255,0.2);
      --spinner-color: var(--accent);
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --splash-image: none;
      --splash-size: contain;
      --playback-logo-image: none;
      --watermark-color: rgba(255,255,255,0.15);
    }

    /* ── Forensic fingerprint watermark ───────────────────────────
       Above the video, never blocks input; below the now-playing bar. */
    #wm-layer {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      overflow: hidden;
      display: none;
    }
    .wm {
      position: absolute;
      font-weight: 600;
      letter-spacing: 0.03em;
      white-space: nowrap;
      color: #ffffff;
      text-shadow: 0 0.08rem 0.16rem rgba(0,0,0,0.55);
      transition: top 0.6s ease, left 0.6s ease, right 0.6s ease, bottom 0.6s ease;
    }
    #wm-tiled {
      position: fixed;
      top: -10%; left: -10%; right: -10%; bottom: -10%;
      z-index: 15;
      pointer-events: none;
      display: none;
      transform: rotate(-24deg);
      flex-wrap: wrap;
      align-content: space-around;
      justify-content: space-around;
    }
    #wm-tiled .wm-cell {
      width: 32%;
      margin: 2.5% 0;
      text-align: center;
      font-weight: 500;
      white-space: nowrap;
      color: #ffffff;
      text-shadow: 0 0.08rem 0.16rem rgba(0,0,0,0.5);
    }

    /* ── Now playing bar (top) ────────────────────────────────────── */
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: var(--safe-y) var(--safe-x) 6rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
      opacity: 0;
      transform: translateY(-0.6rem);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }
    #overlay.visible { opacity: 1; transform: none; }

    #overlay .brand {
      flex: 0 0 auto;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #ffffff, rgba(255,255,255,0.75));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #overlay .now-playing {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      min-width: 0;
      max-width: 60%;
    }
    #overlay .art {
      flex: 0 0 auto;
      width: 6.4rem;
      height: 3.6rem;
      border-radius: 0.5rem;
      object-fit: cover;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0.3rem 1.2rem rgba(0,0,0,0.45);
      display: none;
    }
    #overlay .art.shown { display: block; }
    #overlay .meta {
      min-width: 0;
      text-align: right;
    }
    #overlay .title-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.7rem;
      min-width: 0;
    }
    #overlay .title {
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #overlay .live {
      flex: 0 0 auto;
      display: none;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.6rem;
      border-radius: 0.35rem;
      background: var(--accent);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    #overlay .live.shown { display: inline-flex; }
    #overlay .live::before {
      content: '';
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: #fff;
    }
    #overlay .subtitle {
      margin-top: 0.3rem;
      font-size: 1.05rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Narrow / portrait previews: stack instead of squeezing the title. */
    @media (max-aspect-ratio: 4/3) {
      #overlay { flex-direction: column; align-items: flex-start; gap: 1rem; }
      #overlay .now-playing { max-width: 100%; }
      #overlay .meta { text-align: left; }
      #overlay .title-row { justify-content: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Idle / splash -->
  <div id="splash">
    <div class="logo-text" id="platformName">StreamNxt+</div>
    <div class="tagline" id="tagline">Your Entertainment, Your Way</div>
    <div class="ready"><span class="dot"></span>Ready to cast</div>
  </div>

  <!-- Cast Media Player (Google's built-in player component) -->
  <div id="player">
    <cast-media-player></cast-media-player>
  </div>

  <!-- Forensic fingerprint watermark (single roaming/fixed + tiled grid) -->
  <div id="wm-layer"><div id="wm" class="wm"></div></div>
  <div id="wm-tiled"></div>

  <!-- Now playing bar -->
  <div id="overlay">
    <div class="brand" id="overlayBrand">StreamNxt+</div>
    <div class="now-playing">
      <div class="meta">
        <div class="title-row">
          <span class="live" id="liveBadge">LIVE</span>
          <div class="title" id="mediaTitle"></div>
        </div>
        <div class="subtitle" id="mediaSubtitle"></div>
      </div>
      <img class="art" id="mediaArt" alt="">
    </div>
  </div>

  <!-- Google Cast CAF Receiver SDK -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // ── Configuration ──
    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = false;
    options.maxInactivity = 300; // 5 min idle timeout
    options.supportedCommands =
      cast.framework.messages.Command.ALL_BASIC_MEDIA |
      cast.framework.messages.Command.STREAM_VOLUME |
      cast.framework.messages.Command.STREAM_MUTE;

    // ── Splash / Player visibility ──
    const splash = document.getElementById('splash');
    const overlay = document.getElementById('overlay');
    const mediaTitle = document.getElementById('mediaTitle');
    const mediaSubtitle = document.getElementById('mediaSubtitle');
    const mediaArt = document.getElementById('mediaArt');
    const liveBadge = document.getElementById('liveBadge');

    let overlayTimer = null;

    function showOverlay() {
      overlay.classList.add('visible');
      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => overlay.classList.remove('visible'), 5000);
    }

    // Fill the now-playing bar from the loaded media: title, subtitle, the
    // first artwork image (widest last — a backdrop reads better in a 16:9
    // thumb), and a LIVE badge for live streams.
    function fillNowPlaying(media) {
      const md = (media && media.metadata) || {};
      mediaTitle.textContent = md.title || '';
      mediaSubtitle.textContent = md.subtitle || '';
      const imgs = Array.isArray(md.images) ? md.images : [];
      const art = imgs.length ? (imgs[imgs.length - 1].url || imgs[0].url) : '';
      if (art) {
        mediaArt.onerror = () => mediaArt.classList.remove('shown');
        mediaArt.src = art;
        mediaArt.classList.add('shown');
      } else {
        mediaArt.removeAttribute('src');
        mediaArt.classList.remove('shown');
      }
      const isLive = !!media && media.streamType === cast.framework.messages.StreamType.LIVE;
      liveBadge.classList.toggle('shown', isLive);
    }

    function clearNowPlaying() {
      mediaTitle.textContent = '';
      mediaSubtitle.textContent = '';
      mediaArt.removeAttribute('src');
      mediaArt.classList.remove('shown');
      liveBadge.classList.remove('shown');
    }

    // ── Forensic watermark ──────────────────────────────────────────────────
    // The sender (web / mobile) resolves the per-user fingerprint + style from
    // the tenant's visibleWatermark config and ships it in media.customData.
    // The receiver only renders it, so the fingerprint logic stays in one place.
    const wmEl    = document.getElementById('wm');
    const wmLayer = document.getElementById('wm-layer');
    const tiledEl = document.getElementById('wm-tiled');

    const WM_POSITIONS = [
      { top: '8%',  left: '6%' },
      { top: '8%',  right: '6%' },
      { bottom: '12%', left: '6%' },
      { bottom: '12%', right: '6%' },
      { top: '42%', left: '30%' },
      { top: '30%', right: '18%' },
      { bottom: '28%', left: '20%' },
      { bottom: '40%', right: '28%' }
    ];

    let wmCfg = null;
    let wmPos = 0;
    let wmRoamTimer = null;
    let wmClockTimer = null;

    function wmClearTimers() {
      if (wmRoamTimer)  { clearInterval(wmRoamTimer);  wmRoamTimer = null; }
      if (wmClockTimer) { clearInterval(wmClockTimer); wmClockTimer = null; }
    }

    function wmBaseText() {
      let t = (wmCfg && wmCfg.text) ? String(wmCfg.text) : '';
      if (wmCfg && wmCfg.showTimestamp) {
        const d = new Date();
        const hh = ('0' + d.getHours()).slice(-2);
        const mm = ('0' + d.getMinutes()).slice(-2);
        t += '  ' + hh + ':' + mm;
      }
      return t;
    }

    function wmPlace(el, pos) {
      el.style.top = el.style.bottom = el.style.left = el.style.right = 'auto';
      if (pos.top    != null) el.style.top    = pos.top;
      if (pos.bottom != null) el.style.bottom = pos.bottom;
      if (pos.left   != null) el.style.left   = pos.left;
      if (pos.right  != null) el.style.right  = pos.right;
    }

    function wmRender() {
      wmClearTimers();
      wmLayer.style.display = 'none';
      tiledEl.style.display = 'none';
      if (!wmCfg || !wmCfg.text) return;

      const opacity = (typeof wmCfg.opacity === 'number') ? wmCfg.opacity : 0.12;
      const color   = wmCfg.color || '#ffffff';
      // The sender's size is a phone/web px value. Expressed in rem it scales
      // with the screen like the rest of the page; ×1.1 because a TV is viewed
      // from further away.
      const fontRem = ((wmCfg.fontSize || 16) / 16) * 1.1;
      const mode    = wmCfg.mode || 'roaming';

      if (mode === 'tiled') {
        tiledEl.style.display = 'flex';
        tiledEl.style.opacity = String(opacity * 0.8);
        tiledEl.innerHTML = '';
        const txt = wmBaseText();
        for (let i = 0; i < 12; i++) {
          const c = document.createElement('div');
          c.className = 'wm-cell';
          c.style.color = color;
          c.style.fontSize = (fontRem * 0.85).toFixed(3) + 'rem';
          c.textContent = txt;
          tiledEl.appendChild(c);
        }
        if (wmCfg.showTimestamp) {
          wmClockTimer = setInterval(() => {
            const t = wmBaseText();
            tiledEl.querySelectorAll('.wm-cell').forEach((c) => { c.textContent = t; });
          }, 30000);
        }
        return;
      }

      wmLayer.style.display = 'block';
      wmEl.style.opacity  = String(opacity);
      wmEl.style.color    = color;
      wmEl.style.fontSize = fontRem.toFixed(3) + 'rem';
      wmEl.textContent    = wmBaseText();

      if (mode === 'fixed') {
        wmPlace(wmEl, { top: '50%', left: '50%' });
        wmEl.style.transform = 'translate(-50%, -50%)';
      } else {
        wmEl.style.transform = 'none';
        wmPos = 0;
        wmPlace(wmEl, WM_POSITIONS[0]);
        const everyMs = (wmCfg.roamIntervalSec || 20) * 1000;
        wmRoamTimer = setInterval(() => {
          wmPos = (wmPos + 1) % WM_POSITIONS.length;
          wmPlace(wmEl, WM_POSITIONS[wmPos]);
        }, everyMs);
      }

      if (wmCfg.showTimestamp) {
        wmClockTimer = setInterval(() => { wmEl.textContent = wmBaseText(); }, 30000);
      }
    }

    function wmHide() {
      wmClearTimers();
      wmLayer.style.display = 'none';
      tiledEl.style.display = 'none';
    }

    // ── Player Events ──

    // Media loaded — hide splash, show overlay briefly, draw the fingerprint
    playerManager.addEventListener(
      cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
      () => {
        splash.classList.add('hidden');
        fillNowPlaying(playerManager.getMediaInformation());
        showOverlay();
        wmRender();
      }
    );

    // Media ended — show splash again, drop the fingerprint
    playerManager.addEventListener(
      cast.framework.events.EventType.MEDIA_FINISHED,
      () => {
        splash.classList.remove('hidden');
        clearNowPlaying();
        wmHide();
      }
    );

    // Playback started/resumed — flash overlay
    playerManager.addEventListener(
      cast.framework.events.EventType.PLAYING,
      () => showOverlay()
    );

    // Pause — show overlay persistently
    playerManager.addEventListener(
      cast.framework.events.EventType.PAUSE,
      () => {
        overlay.classList.add('visible');
        clearTimeout(overlayTimer);
      }
    );

    // Seek — flash overlay
    playerManager.addEventListener(
      cast.framework.events.EventType.SEEKED,
      () => showOverlay()
    );

    // ── Intercept LOAD request for custom handling ──
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (request) => {
        // Capture the forensic fingerprint shipped by the sender.
        try {
          const cd = request && request.media && request.media.customData;
          wmCfg = (cd && cd.watermark && cd.watermark.text) ? cd.watermark : null;
        } catch (e) { wmCfg = null; }

        // IMPORTANT: do NOT force hlsSegmentFormat here. The AUDIO container
        // differs per title (encoded = TS-wrapped, imported = raw ADTS) and the
        // sender already sets the correct value. Hard-coding TS — as the old
        // receiver did — re-broke imported titles (TS demux of raw AAC = no
        // audio/video). Leave the sender's value untouched.
        return request;
      }
    );

    // Sender may refresh the fingerprint mid-session (optional, safe no-op).
    context.addCustomMessageListener('urn:x-cast:com.streamnxt.watermark', (event) => {
      try {
        const d = event && event.data;
        wmCfg = (d && d.watermark && d.watermark.text) ? d.watermark
              : (d && d.text) ? d : null;
      } catch (e) {}
      wmRender();
    });

    // ── Error handling ──
    playerManager.addEventListener(
      cast.framework.events.EventType.ERROR,
      (event) => {
        console.error('[StreamNXT Receiver] Error:', event.detailedErrorCode, event);
      }
    );

    // ── Start the receiver ──
    context.start(options);
    console.log('[StreamNXT Receiver] Started');
  </script>
</body>
</html>

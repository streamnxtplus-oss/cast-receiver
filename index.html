<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamNXT Cast Receiver</title>
  <style>
    /*
     * Sizing is relative to the screen, never fixed pixels. Cast devices lay
     * the page out at 1280×720, 1920×1080 or larger, so the root font size
     * follows the smaller viewport side and everything else is rem.
     *
     * COMPATIBILITY: Cast devices run old Chromium builds. No `inset` (Chrome
     * 87), no flexbox `gap` (84), `clamp()` (79) only as an override on a plain
     * value, and no `?.` / `??` in script (80). `inset: 0` on an older receiver
     * left the player with no size — video gone, audio playing — and shrank the
     * splash into a corner. Use top/right/bottom/left and margins.
     *
     * The player UI is our own. Google's <cast-media-player> drew a second
     * title, logo and progress bar over ours; playback now runs in a plain
     * <video> handed to the player manager (setMediaElement), and everything
     * on screen below is this page.
     */
    :root {
      --accent: #e63946;
      --accent-2: #ff8c42;
      --bg: #07070d;
      --text: #ffffff;
      --text-dim: rgba(255,255,255,0.68);
      --text-faint: rgba(255,255,255,0.42);
      --safe-x: 5vw;
      --safe-y: 5.5vh;
      font-size: 2.2vmin;
      font-size: clamp(10px, 2.2vmin, 40px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .fill {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Video ───────────────────────────────────────────────────── */
    #video {
      z-index: 1;
      background: #000;
      object-fit: contain;
    }

    /* ── Loading backdrop (VOD artwork until the first frame) ────── */
    #backdrop {
      z-index: 2;
      background: var(--bg);
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    #backdrop.shown { opacity: 1; }
    #backdrop .img {
      position: absolute;
      top: -4%; right: -4%; bottom: -4%; left: -4%;
      background-size: cover;
      background-position: center;
      filter: blur(1.2rem) brightness(0.45);
      -webkit-filter: blur(1.2rem) brightness(0.45);
    }

    /* ── Idle / splash ───────────────────────────────────────────── */
    #splash {
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--safe-y) var(--safe-x);
      text-align: center;
      background:
        radial-gradient(60vmax 60vmax at 20% 15%, rgba(230,57,70,0.18), transparent 60%),
        radial-gradient(55vmax 55vmax at 85% 90%, rgba(255,140,66,0.12), transparent 60%),
        linear-gradient(160deg, #0b0812 0%, var(--bg) 60%);
      transition: opacity 0.6s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash .logo-text {
      font-size: 4.6rem;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #splash .tagline {
      margin-top: 1.2rem;
      font-size: 1.35rem;
      color: var(--text-dim);
    }
    #splash .ready {
      margin-top: 2.2rem;
      display: inline-flex;
      align-items: center;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      font-size: 1rem;
      color: var(--text-dim);
    }
    #splash .ready .dot {
      margin-right: 0.7rem;
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: var(--accent);
      animation: ping 1.8s ease-out infinite;
    }
    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 rgba(230,57,70,0.55); }
      80%  { box-shadow: 0 0 0 0.9rem rgba(230,57,70,0); }
      100% { box-shadow: 0 0 0 0 rgba(230,57,70,0); }
    }

    /* ── Watermark ───────────────────────────────────────────────── */
    #wm-layer {
      z-index: 15;
      pointer-events: none;
      overflow: hidden;
      display: none;
    }
    .wm {
      position: absolute;
      font-weight: 600;
      letter-spacing: 0.03em;
      white-space: nowrap;
      color: #ffffff;
      text-shadow: 0 0.08rem 0.16rem rgba(0,0,0,0.55);
      transition: top 0.6s ease, left 0.6s ease, right 0.6s ease, bottom 0.6s ease;
    }
    #wm-tiled {
      position: fixed;
      top: -10%; left: -10%; right: -10%; bottom: -10%;
      z-index: 15;
      pointer-events: none;
      display: none;
      transform: rotate(-24deg);
      flex-wrap: wrap;
      align-content: space-around;
      justify-content: space-around;
    }
    #wm-tiled .wm-cell {
      width: 32%;
      margin: 2.5% 0;
      text-align: center;
      font-weight: 500;
      white-space: nowrap;
      color: #ffffff;
      text-shadow: 0 0.08rem 0.16rem rgba(0,0,0,0.5);
    }

    /* ── Player chrome (shown on start / pause / seek) ───────────── */
    #chrome {
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    body.ui #chrome { opacity: 1; }

    #chrome .scrim-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 24vh;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    }
    #chrome .scrim-bottom {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 55vh;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.55) 45%, transparent 100%);
    }

    #chrome .brand {
      position: absolute;
      top: var(--safe-y);
      left: var(--safe-x);
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #chrome .info {
      position: absolute;
      left: var(--safe-x);
      right: var(--safe-x);
      bottom: var(--safe-y);
      display: flex;
      align-items: flex-end;
      transform: translateY(1rem);
      transition: transform 0.4s ease;
    }
    body.ui #chrome .info { transform: none; }

    /* Artwork: a 2:3 poster for films and episodes, a square tile for a live
       channel's logo (logos are drawn to fit, never cropped). */
    #chrome .art {
      flex: 0 0 auto;
      margin-right: 2rem;
      border-radius: 0.7rem;
      overflow: hidden;
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0.6rem 2rem rgba(0,0,0,0.55);
      display: none;
    }
    #chrome .art.shown { display: block; }
    #chrome .art img { display: block; width: 100%; height: 100%; }
    #chrome .art.poster { width: 9.5rem; height: 14.25rem; }
    #chrome .art.poster img { object-fit: cover; }
    #chrome .art.logo {
      width: 9rem;
      height: 9rem;
      padding: 1.1rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.14);
    }
    #chrome .art.logo img { object-fit: contain; }

    #chrome .meta {
      flex: 1 1 auto;
      min-width: 0;
      padding-bottom: 0.2rem;
    }
    #chrome .badges {
      display: flex;
      align-items: center;
      margin-bottom: 0.8rem;
    }
    #chrome .badge {
      display: none;
      align-items: center;
      margin-right: 0.7rem;
      padding: 0.25rem 0.7rem;
      border-radius: 0.35rem;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #chrome .badge.shown { display: inline-flex; }
    #chrome .badge.live { background: var(--accent); }
    #chrome .badge.live::before {
      content: '';
      margin-right: 0.45rem;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #fff;
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    #chrome .badge.kind {
      background: rgba(255,255,255,0.14);
      color: var(--text-dim);
    }
    #chrome .title {
      font-size: 2.6rem;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0.1rem 0.6rem rgba(0,0,0,0.5);
    }
    #chrome .subtitle {
      margin-top: 0.45rem;
      font-size: 1.2rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #chrome .progress {
      margin-top: 1.6rem;
      display: none;
    }
    #chrome .progress.shown { display: block; }
    #chrome .track {
      position: relative;
      height: 0.35rem;
      border-radius: 1rem;
      background: rgba(255,255,255,0.2);
      overflow: hidden;
    }
    #chrome .fill-bar {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 0;
      border-radius: 1rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    #chrome .times {
      display: flex;
      justify-content: space-between;
      margin-top: 0.6rem;
      font-size: 1rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    /* ── Centre status: pause glyph / buffering spinner ──────────── */
    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 22;
      width: 7rem;
      height: 7rem;
      margin: -3.5rem 0 0 -3.5rem;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      pointer-events: none;
    }
    #status.paused, #status.buffering { display: flex; }
    #status .pause { display: none; }
    #status.paused .pause { display: flex; }
    #status .pause span {
      display: block;
      width: 0.85rem;
      height: 2.8rem;
      margin: 0 0.45rem;
      border-radius: 0.2rem;
      background: #fff;
    }
    #status .spin {
      display: none;
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      border: 0.35rem solid rgba(255,255,255,0.18);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    #status.buffering { background: transparent; }
    #status.buffering .spin { display: block; }
    #status.buffering .pause { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error message ───────────────────────────────────────────── */
    #error {
      z-index: 31;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--safe-y) var(--safe-x);
      background: rgba(7,7,13,0.92);
    }
    #error.shown { display: flex; }
    #error .h { font-size: 2.2rem; font-weight: 800; }
    #error .p { margin-top: 0.8rem; font-size: 1.2rem; color: var(--text-dim); }

    /* Narrow / portrait: smaller artwork and title so the panel still fits. */
    @media (max-aspect-ratio: 4/3) {
      #chrome .art.poster { width: 7rem; height: 10.5rem; }
      #chrome .art.logo { width: 7rem; height: 7rem; }
      #chrome .title { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <video id="video" class="fill" playsinline></video>
  <div id="backdrop" class="fill"><div class="img" id="backdropImg"></div></div>

  <div id="wm-layer" class="fill"><div id="wm" class="wm"></div></div>
  <div id="wm-tiled"></div>

  <div id="chrome" class="fill">
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>
    <div class="brand">StreamNxt+</div>
    <div class="info">
      <div class="art" id="art"><img id="artImg" alt=""></div>
      <div class="meta">
        <div class="badges">
          <span class="badge live" id="liveBadge">Live</span>
          <span class="badge kind" id="kindBadge"></span>
        </div>
        <div class="title" id="mediaTitle"></div>
        <div class="subtitle" id="mediaSubtitle"></div>
        <div class="progress" id="progress">
          <div class="track"><div class="fill-bar" id="progressFill"></div></div>
          <div class="times"><span id="timeCur">0:00</span><span id="timeDur">0:00</span></div>
        </div>
      </div>
    </div>
  </div>

  <div id="status"><div class="pause"><span></span><span></span></div><div class="spin"></div></div>

  <div id="error" class="fill">
    <div class="h">Can't play this right now</div>
    <div class="p">Try again from your phone.</div>
  </div>

  <div id="splash" class="fill">
    <div class="logo-text">StreamNxt+</div>
    <div class="tagline">Your Entertainment, Your Way</div>
    <div class="ready"><span class="dot"></span>Ready to cast</div>
  </div>

  <!-- Google Cast CAF Receiver SDK -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();
    const E = cast.framework.events.EventType;

    // Playback in our own element — no Google player UI over the video.
    const videoEl = document.getElementById('video');
    playerManager.setMediaElement(videoEl);

    // ── Configuration ──
    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = false;
    options.maxInactivity = 300; // 5 min idle timeout
    options.supportedCommands =
      cast.framework.messages.Command.ALL_BASIC_MEDIA |
      cast.framework.messages.Command.STREAM_VOLUME |
      cast.framework.messages.Command.STREAM_MUTE;

    // ── Elements ──
    const $ = (id) => document.getElementById(id);
    const splash = $('splash'), errorEl = $('error'), statusEl = $('status');
    const backdrop = $('backdrop'), backdropImg = $('backdropImg');
    const art = $('art'), artImg = $('artImg');
    const titleEl = $('mediaTitle'), subtitleEl = $('mediaSubtitle');
    const liveBadge = $('liveBadge'), kindBadge = $('kindBadge');
    const progress = $('progress'), progressFill = $('progressFill');
    const timeCur = $('timeCur'), timeDur = $('timeDur');

    let isLive = false;
    let started = false;
    let uiTimer = null;

    function fmt(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      const ss = (s < 10 ? '0' : '') + s;
      return h > 0 ? h + ':' + (m < 10 ? '0' : '') + m + ':' + ss : m + ':' + ss;
    }

    // Show the chrome; auto-hide after `ms` unless paused (ms = 0 keeps it).
    function showUi(ms) {
      document.body.classList.add('ui');
      clearTimeout(uiTimer);
      if (ms) uiTimer = setTimeout(() => {
        if (playerManager.getPlayerState() === cast.framework.messages.PlayerState.PLAYING) {
          document.body.classList.remove('ui');
        }
      }, ms);
    }
    function hideUi() {
      clearTimeout(uiTimer);
      document.body.classList.remove('ui');
    }

    function imageUrl(images, index) {
      const img = images && images[index];
      return (img && img.url) ? img.url : '';
    }

    // Fill the panel from what the sender put in the media metadata. The
    // mobile app sends a live channel's logo as the first image, and a title's
    // poster first then its backdrop.
    function fillMedia(media) {
      const md = (media && media.metadata) || {};
      const images = Array.isArray(md.images) ? md.images : [];
      isLive = !!media && media.streamType === cast.framework.messages.StreamType.LIVE;

      titleEl.textContent = md.title || '';
      subtitleEl.textContent = (md.subtitle && !(isLive && /^live$/i.test(md.subtitle))) ? md.subtitle : '';
      liveBadge.classList.toggle('shown', isLive);
      kindBadge.textContent = isLive ? '' : (md.metadataType === cast.framework.messages.MetadataType.TV_SHOW ? 'Episode' : '');
      kindBadge.classList.toggle('shown', !!kindBadge.textContent);
      progress.classList.toggle('shown', !isLive);

      const primary = imageUrl(images, 0);
      art.className = 'art ' + (isLive ? 'logo' : 'poster');
      if (primary) {
        artImg.onerror = () => art.classList.remove('shown');
        artImg.src = primary;
        art.classList.add('shown');
      } else {
        artImg.removeAttribute('src');
      }

      const wide = imageUrl(images, 1) || (isLive ? '' : primary);
      backdropImg.style.backgroundImage = wide ? 'url("' + wide.replace(/"/g, '%22') + '")' : 'none';
    }

    function updateProgress() {
      if (isLive) return;
      const dur = playerManager.getDurationSec() || 0;
      const cur = playerManager.getCurrentTimeSec() || 0;
      progressFill.style.width = (dur > 0 ? Math.min(100, (cur / dur) * 100) : 0) + '%';
      timeCur.textContent = fmt(cur);
      timeDur.textContent = dur > 0 ? fmt(dur) : '';
    }

    function resetToIdle() {
      started = false;
      hideUi();
      statusEl.className = '';
      backdrop.classList.remove('shown');
      splash.classList.remove('hidden');
      wmHide();
    }

    // ── Forensic watermark ──────────────────────────────────────────────────
    // The sender resolves the per-user fingerprint + style from the tenant's
    // visibleWatermark config and ships it in media.customData; the receiver
    // only renders it.
    const wmEl    = $('wm');
    const wmLayer = $('wm-layer');
    const tiledEl = $('wm-tiled');

    const WM_POSITIONS = [
      { top: '8%',  left: '6%' },
      { top: '8%',  right: '6%' },
      { bottom: '12%', left: '6%' },
      { bottom: '12%', right: '6%' },
      { top: '42%', left: '30%' },
      { top: '30%', right: '18%' },
      { bottom: '28%', left: '20%' },
      { bottom: '40%', right: '28%' }
    ];

    let wmCfg = null;
    let wmPos = 0;
    let wmRoamTimer = null;
    let wmClockTimer = null;

    function wmClearTimers() {
      if (wmRoamTimer)  { clearInterval(wmRoamTimer);  wmRoamTimer = null; }
      if (wmClockTimer) { clearInterval(wmClockTimer); wmClockTimer = null; }
    }

    function wmBaseText() {
      let t = (wmCfg && wmCfg.text) ? String(wmCfg.text) : '';
      if (wmCfg && wmCfg.showTimestamp) {
        const d = new Date();
        t += '  ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
      }
      return t;
    }

    function wmPlace(el, pos) {
      el.style.top = el.style.bottom = el.style.left = el.style.right = 'auto';
      if (pos.top    != null) el.style.top    = pos.top;
      if (pos.bottom != null) el.style.bottom = pos.bottom;
      if (pos.left   != null) el.style.left   = pos.left;
      if (pos.right  != null) el.style.right  = pos.right;
    }

    function wmRender() {
      wmClearTimers();
      wmLayer.style.display = 'none';
      tiledEl.style.display = 'none';
      if (!wmCfg || !wmCfg.text) return;

      const opacity = (typeof wmCfg.opacity === 'number') ? wmCfg.opacity : 0.12;
      const color   = wmCfg.color || '#ffffff';
      // Sender size is a phone/web px value; in rem it scales with the screen,
      // ×1.1 because a TV is viewed from further away.
      const fontRem = ((wmCfg.fontSize || 16) / 16) * 1.1;
      const mode    = wmCfg.mode || 'roaming';

      if (mode === 'tiled') {
        tiledEl.style.display = 'flex';
        tiledEl.style.opacity = String(opacity * 0.8);
        tiledEl.innerHTML = '';
        const txt = wmBaseText();
        for (let i = 0; i < 12; i++) {
          const c = document.createElement('div');
          c.className = 'wm-cell';
          c.style.color = color;
          c.style.fontSize = (fontRem * 0.85).toFixed(3) + 'rem';
          c.textContent = txt;
          tiledEl.appendChild(c);
        }
        if (wmCfg.showTimestamp) {
          wmClockTimer = setInterval(() => {
            const t = wmBaseText();
            tiledEl.querySelectorAll('.wm-cell').forEach((c) => { c.textContent = t; });
          }, 30000);
        }
        return;
      }

      wmLayer.style.display = 'block';
      wmEl.style.opacity  = String(opacity);
      wmEl.style.color    = color;
      wmEl.style.fontSize = fontRem.toFixed(3) + 'rem';
      wmEl.textContent    = wmBaseText();

      if (mode === 'fixed') {
        wmPlace(wmEl, { top: '50%', left: '50%' });
        wmEl.style.transform = 'translate(-50%, -50%)';
      } else {
        wmEl.style.transform = 'none';
        wmPos = 0;
        wmPlace(wmEl, WM_POSITIONS[0]);
        const everyMs = (wmCfg.roamIntervalSec || 20) * 1000;
        wmRoamTimer = setInterval(() => {
          wmPos = (wmPos + 1) % WM_POSITIONS.length;
          wmPlace(wmEl, WM_POSITIONS[wmPos]);
        }, everyMs);
      }

      if (wmCfg.showTimestamp) {
        wmClockTimer = setInterval(() => { wmEl.textContent = wmBaseText(); }, 30000);
      }
    }

    function wmHide() {
      wmClearTimers();
      wmLayer.style.display = 'none';
      tiledEl.style.display = 'none';
    }

    // ── Player Events ──

    // A load starts: leave the splash, show the title's artwork while the
    // stream spins up.
    playerManager.addEventListener(E.PLAYER_LOADING, () => {
      errorEl.classList.remove('shown');
      splash.classList.add('hidden');
      if (!isLive) backdrop.classList.add('shown');
      statusEl.className = 'buffering';
      showUi(0);
    });

    playerManager.addEventListener(E.PLAYER_LOAD_COMPLETE, () => {
      fillMedia(playerManager.getMediaInformation());
      updateProgress();
      wmRender();
    });

    playerManager.addEventListener(E.PLAYING, () => {
      started = true;
      backdrop.classList.remove('shown');
      statusEl.className = '';
      showUi(5000);
    });

    playerManager.addEventListener(E.PAUSE, () => {
      if (!started) return;
      statusEl.className = 'paused';
      updateProgress();
      showUi(0);
    });

    playerManager.addEventListener(E.BUFFERING, (e) => {
      if (e.isBuffering) statusEl.className = 'buffering';
      else if (statusEl.className === 'buffering') statusEl.className = '';
    });

    playerManager.addEventListener(E.SEEKING, () => showUi(0));
    playerManager.addEventListener(E.SEEKED, () => { updateProgress(); showUi(5000); });
    playerManager.addEventListener(E.TIME_UPDATE, () => {
      if (document.body.classList.contains('ui')) updateProgress();
    });

    playerManager.addEventListener(E.MEDIA_FINISHED, () => resetToIdle());

    playerManager.addEventListener(E.ERROR, (event) => {
      console.error('[StreamNXT Receiver] Error:', event.detailedErrorCode, event);
      statusEl.className = '';
      backdrop.classList.remove('shown');
      errorEl.classList.add('shown');
    });

    // ── Intercept LOAD request for custom handling ──
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (request) => {
        // Capture the forensic fingerprint shipped by the sender.
        try {
          const cd = request && request.media && request.media.customData;
          wmCfg = (cd && cd.watermark && cd.watermark.text) ? cd.watermark : null;
        } catch (e) { wmCfg = null; }

        // Artwork and title from the request itself: the player's own media
        // information is not populated yet while it is still loading.
        try { fillMedia(request && request.media); } catch (e) {}

        // IMPORTANT: do NOT force hlsSegmentFormat here. The AUDIO container
        // differs per title (encoded = TS-wrapped, imported = raw ADTS) and the
        // sender already sets the correct value. Hard-coding TS — as the old
        // receiver did — re-broke imported titles (TS demux of raw AAC = no
        // audio/video). Leave the sender's value untouched.
        return request;
      }
    );

    // Sender may refresh the fingerprint mid-session (optional, safe no-op).
    context.addCustomMessageListener('urn:x-cast:com.streamnxt.watermark', (event) => {
      try {
        const d = event && event.data;
        wmCfg = (d && d.watermark && d.watermark.text) ? d.watermark
              : (d && d.text) ? d : null;
      } catch (e) {}
      wmRender();
    });

    // ── Start the receiver ──
    context.start(options);
    console.log('[StreamNXT Receiver] Started');
  </script>
</body>
</html>
